name: Complete Pack submission
description: Share a new Complete Pack or update one you already published.
title: "[Complete Pack] "
labels:
  - complete-pack-submission
body:
  - type: markdown
    attributes:
      value: |
        *This is only the GitHub issue title. It is not the pack name shown in Aniki ReMake / Aniki Helper.*

        Use **Share Community Pack** in Aniki Pack Creator, then attach the generated ZIP file(s) below.

        The **description and preview come directly from Aniki Pack Creator**. If the Creator splits the pack into several `.partXX-of-XX.zip` files, attach every part without renaming them.

        The packs inside a Complete Pack are checked automatically.
  - type: input
    id: pack-name
    attributes:
      label: Pack name
      description: The name users will see in Aniki ReMake / Aniki Helper.
      placeholder: PlayStation 5 Complete Pack
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
      description: The creator name shown to users in the Community Packs browser.
      placeholder: Mike Aniki
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Use the same version number shown in Aniki Pack Creator.
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: zip
    attributes:
      label: Complete Pack ZIP
      description: Attach the ZIP created by Share Community Pack. If it was split, attach every generated part.
      placeholder: Drag and drop the generated ZIP file(s) here.
    validations:
      required: true
  - type: dropdown
    id: submission-type
    attributes:
      label: Submission type
      description: Choose New pack for the first publication, or Update for a pack already in the Community catalog.
      options:
        - New pack
        - Update to an existing pack
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I confirm the ZIP file(s) were prepared directly with Aniki Pack Creator.
          required: true
        - label: I understand that an update must keep the original Pack ID.
          required: true
        - label: I am responsible for the content I submit and have the right to share it.
          required: true
