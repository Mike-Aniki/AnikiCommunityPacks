name: Complete Pack submission
description: Share a coordinated Complete Pack or publish an update to one of your existing Complete Packs.
title: "[Complete Pack] "
labels:
  - complete-pack-submission
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your Complete Pack! Export the final Complete Pack ZIP directly from **Aniki Pack Creator** and attach it below.

        GitHub will also validate every Visual, Login, Sound and Color Pack contained inside the Complete Pack before it can be reviewed.

  - type: input
    id: pack-name
    attributes:
      label: Pack name
      placeholder: PlayStation 5 Complete Pack
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
      description: Name displayed to users in the Community Packs browser.
      placeholder: Mike Aniki
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Use the exact version exported by Aniki Pack Creator.
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Optional short description shown to users.
      placeholder: A complete PlayStation 5-inspired setup for Aniki ReMake.
  - type: textarea
    id: zip
    attributes:
      label: Complete Pack ZIP
      description: Drag and drop the final Complete Pack ZIP exported by Aniki Pack Creator here.
      placeholder: Attach the ZIP here.
    validations:
      required: true
  - type: textarea
    id: preview
    attributes:
      label: Preview image
      description: Attach one representative JPG or PNG image for the Complete Pack.
      placeholder: Attach the preview image here.
    validations:
      required: true
  - type: dropdown
    id: submission-type
    attributes:
      label: Submission type
      options:
        - New pack
        - Update to an existing pack
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I confirm this ZIP was exported directly with Aniki Pack Creator.
          required: true
        - label: I understand that updates must keep the permanent ID from the original Creator project.
          required: true
        - label: I am responsible for the content I submit and have the right to share it.
          required: true
