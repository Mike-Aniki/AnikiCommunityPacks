name: Login Pack submission
description: Share a new Login Pack or publish an update to one of your existing Login Packs.
title: "[Login Pack] "
labels:
  - login-pack-submission
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your Login Pack! Export the ZIP directly from **Aniki Pack Creator** and attach it below.

        Login videos are automatically checked for the supported MP4 format and codec before review.

  - type: input
    id: pack-name
    attributes:
      label: Pack name
      placeholder: Persona 5 Login
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
      description: Name displayed to users in the Community Packs browser.
      placeholder: Mike Aniki
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Use the exact version exported by Aniki Pack Creator.
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Optional short description shown to users.
      placeholder: Animated login inspired by Persona 5.
  - type: textarea
    id: zip
    attributes:
      label: Login Pack ZIP
      description: Drag and drop the ZIP exported by Aniki Pack Creator here.
      placeholder: Attach the ZIP here.
    validations:
      required: true
  - type: textarea
    id: preview
    attributes:
      label: Preview image
      description: Attach one representative JPG or PNG frame from the login video.
      placeholder: Attach the preview image here.
    validations:
      required: true
  - type: dropdown
    id: submission-type
    attributes:
      label: Submission type
      options:
        - New pack
        - Update to an existing pack
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I confirm this ZIP was exported directly with Aniki Pack Creator.
          required: true
        - label: I understand that updates must keep the permanent ID from the original Creator project.
          required: true
        - label: I am responsible for the content I submit and have the right to share it.
          required: true
