name: Login Pack submission
description: Share a new Login Pack or publish an update to one of your existing Login Packs.
title: "[Login Pack] "
labels:
  - login-pack-submission
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your Login Pack! Use **Share Community Pack** in Aniki Pack Creator and attach the prepared file(s) below. The preview image is embedded automatically in the pack ZIP by the Creator, so no separate image attachment is needed.

        GitHub limits individual ZIP attachments to 25 MB. Login Packs can easily exceed this limit, so Aniki Pack Creator automatically splits large submissions into several `.partXX-of-XX.zip` files. **Attach every generated part and do not rename or modify them.**

        Login videos are automatically checked for the supported MP4 format and codec before review.
  - type: input
    id: pack-name
    attributes:
      label: Pack name
      placeholder: Persona 5 Login
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
      description: Name displayed to users in the Community Packs browser.
      placeholder: Mike Aniki
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Use the exact version exported by Aniki Pack Creator.
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Optional short description shown to users.
      placeholder: Animated login inspired by Persona 5.
  - type: textarea
    id: zip
    attributes:
      label: Login Pack ZIP
      description: Attach the ZIP prepared by Aniki Pack Creator. If the Creator generated multipart ZIPs, attach ALL `.partXX-of-XX.zip` files here.
      placeholder: Attach the ZIP, or all generated multipart ZIPs, here.
    validations:
      required: true
  - type: dropdown
    id: submission-type
    attributes:
      label: Submission type
      options:
        - New pack
        - Update to an existing pack
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I confirm the ZIP or multipart ZIPs were prepared directly with Aniki Pack Creator.
          required: true
        - label: I understand that updates must keep the permanent ID from the original Creator project.
          required: true
        - label: I am responsible for the content I submit and have the right to share it.
          required: true
