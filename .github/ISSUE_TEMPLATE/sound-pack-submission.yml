name: Sound Pack submission
description: Share a new Sound Pack or publish an update to one of your existing Sound Packs.
title: "[Sound Pack] "
labels:
  - sound-pack-submission
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your Sound Pack! Use **Share Community Pack** in Aniki Pack Creator and attach the prepared file(s) below.

        GitHub limits individual ZIP attachments to 25 MB. If your pack is too large, Aniki Pack Creator automatically creates several `.partXX-of-XX.zip` files. **Attach every generated part and do not rename or modify them.**

        Sound Packs can be partial: you do not need to replace every sound or music slot.
  - type: input
    id: pack-name
    attributes:
      label: Pack name
      placeholder: PlayStation 5 Sounds
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
      description: Name displayed to users in the Community Packs browser.
      placeholder: Mike Aniki
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Use the exact version exported by Aniki Pack Creator.
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Optional short description shown to users.
      placeholder: Interface sounds inspired by PlayStation 5.
  - type: textarea
    id: zip
    attributes:
      label: Sound Pack ZIP
      description: Attach the ZIP prepared by Aniki Pack Creator. If the Creator generated multipart ZIPs, attach ALL `.partXX-of-XX.zip` files here.
      placeholder: Attach the ZIP, or all generated multipart ZIPs, here.
    validations:
      required: true
  - type: textarea
    id: preview
    attributes:
      label: Preview image
      description: Attach one representative JPG or PNG cover image for the Community browser.
      placeholder: Attach the preview image here.
    validations:
      required: true
  - type: dropdown
    id: submission-type
    attributes:
      label: Submission type
      options:
        - New pack
        - Update to an existing pack
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I confirm the ZIP or multipart ZIPs were prepared directly with Aniki Pack Creator.
          required: true
        - label: I understand that updates must keep the permanent ID from the original Creator project.
          required: true
        - label: I am responsible for the content I submit and have the right to share it.
          required: true
