name: Setup Community Labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-labels.yml'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update moderation labels
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const wanted = [
              { name: 'visual-pack-submission', color: '5319E7', description: 'Visual Pack submission' },
              { name: 'color-pack-submission', color: 'B60205', description: 'Color Pack submission' },
              { name: 'login-pack-submission', color: '0052CC', description: 'Login Pack submission' },
              { name: 'sound-pack-submission', color: '0E8A16', description: 'Sound Pack submission' },
              { name: 'complete-pack-submission', color: 'D4C5F9', description: 'Complete Pack submission' },
              { name: 'unpublish-request', color: 'BFDADC', description: 'Request to remove a Community Pack from the catalog' },
              { name: 'ready-for-review', color: 'FBCA04', description: 'Automatic validation passed; waiting for maintainer review' },
              { name: 'approved', color: '0E8A16', description: 'Maintainer approved this request' },
              { name: 'published', color: '1D76DB', description: 'Published in the Aniki Community Packs catalog' },
              { name: 'unpublished', color: '6A737D', description: 'Community Pack removed from the catalog' },
              { name: 'validation-failed', color: 'D93F0B', description: 'Automatic validation failed' },
            ];

            for (const label of wanted) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
                await github.rest.issues.updateLabel({
                  owner, repo, name: label.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description,
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, ...label });
                } else {
                  throw error;
                }
              }
            }
