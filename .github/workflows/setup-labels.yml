name: Setup Community Labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-labels.yml'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update moderation labels
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const wanted = [
              { name: 'ready-for-review', color: 'FBCA04', description: 'Automatic validation passed; waiting for maintainer review' },
              { name: 'approved', color: '0E8A16', description: 'Maintainer approved this pack for automatic publication' },
              { name: 'published', color: '1D76DB', description: 'Published in the Aniki Community Visual Packs catalog' },
              { name: 'validation-failed', color: 'D93F0B', description: 'Automatic Visual Pack validation failed' },
            ];

            for (const label of wanted) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
                await github.rest.issues.updateLabel({
                  owner, repo, name: label.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description,
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, ...label });
                } else {
                  throw error;
                }
              }
            }
