name: Validate Community Catalog

on:
  push:
    paths:
      - catalog.json
      - catalog.schema.json
      - scripts/**
      - .github/workflows/validate-catalog.yml
  pull_request:
    paths:
      - catalog.json
      - catalog.schema.json
      - scripts/**
      - .github/workflows/validate-catalog.yml

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py
