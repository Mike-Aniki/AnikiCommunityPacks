name: Validate Community Catalog

on:
  push:
    paths:
      - 'catalog.json'
      - 'catalog.schema.json'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/validate-catalog.yml'
  pull_request:
    paths:
      - 'catalog.json'
      - 'catalog.schema.json'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/validate-catalog.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check validator syntax
        run: python3 -m py_compile scripts/validate_catalog.py

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py
