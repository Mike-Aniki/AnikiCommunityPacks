name: Validate Community Pack Submission

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write
  actions: write
jobs:
  validate:
    if: >-
      (contains(github.event.issue.labels.*.name, 'visual-pack-submission') ||
       contains(github.event.issue.labels.*.name, 'color-pack-submission') ||
       contains(github.event.issue.labels.*.name, 'login-pack-submission') ||
       contains(github.event.issue.labels.*.name, 'sound-pack-submission') ||
       contains(github.event.issue.labels.*.name, 'complete-pack-submission')) &&
      github.event.issue.state == 'open' &&
      !contains(github.event.issue.labels.*.name, 'published') &&
      (github.event.action != 'labeled' || endsWith(github.event.label.name, '-pack-submission'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and validate submitted pack
        id: validate
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
          SUBMITTER_LOGIN: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          python3 scripts/resolve_submission_package.py \
            --output resolved-submission/submitted-pack.zip \
            --report submission-validation.txt
          python3 scripts/validate_submission.py \
            --zip resolved-submission/submitted-pack.zip \
            --report submission-validation.txt
      - name: Post validation result and update status labels
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- aniki-community-pack-validation -->';
            const ok = process.env.VALIDATION_OUTCOME === 'success';
            let report = 'Validation did not produce a report.';
            if (fs.existsSync('submission-validation.txt')) {
              report = fs.readFileSync('submission-validation.txt', 'utf8').trim();
            }
            const typeLine = report.split('\n').find(line => line.startsWith('Type: '));
            const packType = typeLine ? typeLine.substring('Type: '.length) : 'Community Pack';
            const body = `${marker}\n${ok ? `✅ **Automatic ${packType} validation passed.**` : `❌ **Automatic ${packType} validation failed.**`}\n\n\`\`\`text\n${report}\n\`\`\`\n\n${ok ? 'The package is valid. It has been approved automatically and publication is starting.' : 'Replace or fix the submitted ZIP / multipart files, then edit the issue to run validation again.'}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const labels = [
              { name: 'ready-for-review', color: 'FBCA04', description: 'Legacy status label; valid submissions now auto-publish' },
              { name: 'approved', color: '0E8A16', description: 'Approved for automated processing' },
              { name: 'validation-failed', color: 'D93F0B', description: 'Automatic Community Pack validation failed' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, ...label });
                } else throw error;
              }
            }
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
            if (ok) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['approved'] });
              for (const label of ['validation-failed', 'ready-for-review']) {
                try { await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label }); }
                catch (error) { if (error.status !== 404) throw error; }
              }

              // Events created with GITHUB_TOKEN do not start another workflow run.
              // Dispatch the publication workflow explicitly after validation succeeds.
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'publish-approved.yml',
                ref: context.payload.repository.default_branch,
                inputs: { issue_number: String(issue_number) },
              });
            } else {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['validation-failed'] });
              for (const label of ['ready-for-review', 'approved']) {
                try { await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label }); }
                catch (error) { if (error.status !== 404) throw error; }
              }
            }
      - name: Reject invalid package
        if: steps.validate.outcome != 'success'
        run: exit 1
