name: Validate Visual Pack Submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: startsWith(github.event.issue.title, '[Visual Pack]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate submitted ZIP
        id: validate
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/validate_submission.py --report submission-validation.txt

      - name: Post validation result
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- aniki-visual-pack-validation -->';
            const ok = process.env.VALIDATION_OUTCOME === 'success';

            let report = 'Validation did not produce a report.';
            if (fs.existsSync('submission-validation.txt')) {
              report = fs.readFileSync('submission-validation.txt', 'utf8').trim();
            }

            const body = `${marker}\n${ok ? '✅ **Automatic Visual Pack validation passed.**' : '❌ **Automatic Visual Pack validation failed.**'}\n\n\`\`\`text\n${report}\n\`\`\`\n\n${ok ? 'The package structure is valid. The submission can now be reviewed for publication.' : 'Replace or fix the ZIP in the submission, then edit the issue to run validation again.'}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const previous = comments.find(
              comment => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Reject invalid package
        if: steps.validate.outcome != 'success'
        run: exit 1
